name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0

      # The UI fixture test drives a headless browser; the chromium binary isn't
      # in the test's uv env, so install it into the shared playwright cache
      # first. Everything else is run by `just check`.
      - name: Install Playwright Chromium
        run: uv run --with playwright python -m playwright install chromium

      # Single source of truth: CI runs the same recipe as local `just check`,
      # so the two can't drift (this file previously inlined a copy and broke on
      # a path rename it didn't know about).
      - name: Check
        run: just check
