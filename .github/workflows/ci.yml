name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Check
        run: |
          PYTHONPYCACHEPREFIX=/tmp/parloq-pycache python3 -m py_compile \
            recorder/recorder \
            recorder/evals/run_eval.py \
            recorder/evals/test_ui_fixture.py \
            recorder/evals/test_device_resolution.py \
            recorder/evals/test_dictate_trigger.py \
            recorder/evals/test_eval_corpus_paths.py \
            recorder/evals/test_eval_report_format.py \
            recorder/evals/test_fragment_join.py \
            recorder/evals/test_polish_edits.py \
            recorder/evals/test_render_md.py \
            recorder/evals/test_search_cli.py \
            eval/test_emphasis_tag.py
          python3 recorder/evals/test_device_resolution.py
          uv run recorder/evals/test_dictate_trigger.py
          uv run recorder/evals/test_eval_corpus_paths.py
          uv run recorder/evals/test_eval_report_format.py
          python3 recorder/evals/test_fragment_join.py
          uv run recorder/evals/test_polish_edits.py
          uv run recorder/evals/test_render_md.py
          uv run recorder/evals/test_search_cli.py
          uv run eval/test_emphasis_tag.py
          uv run recorder/evals/test_ui_fixture.py
